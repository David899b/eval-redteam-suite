name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Mutation score
        run: python scripts/check_mutation_score.py --threshold 70
      - name: Security (SAST)
        run: bandit -r src -q
      - name: Security (SCA)
        run: python scripts/run_stdlib_checks.py
      - name: Run suite (reference target, expected NO_GO -> exit 1)
        run: |
          set +e
          python -m eval_redteam_suite --attacks data/attacks.json --targets data/target_outputs.json --report-dir reports
          code=$?
          echo "gate exit code: $code (expected 1 = NO_GO)"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-report-py${{ matrix.python-version }}
          path: reports/
