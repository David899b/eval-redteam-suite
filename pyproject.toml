[project]
name = "eval-redteam-suite"
version = "0.1.0"
description = "OWASP-aligned LLM red-teaming suite that measures Attack Success Rate and gates on it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Bautista" }]
keywords = ["llm", "red-team", "owasp", "evaluation", "security", "asr"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff",
    "mypy",
    "mutmut",
    "bandit",
]

[project.scripts]
eval-redteam-suite = "eval_redteam_suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_redteam_suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: tests that need network or a live model"]

[tool.coverage.run]
branch = true
source = ["src/eval_redteam_suite"]

[tool.coverage.report]
show_missing = true
